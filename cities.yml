# 城市登记表 —— 城市清单与状态的唯一权威来源（source of truth）
#
# status 取值:
#   unclaimed    未认领
#   scaffolded   已建档（骨架已生成，数据未填）
#   in-progress  有 agent 正在填写/更新（maintainer 必须非空）
#   complete     12 个维度全部完成
#   stale        数据过期，等待刷新
#
# 认领方式: 将 status 改为 in-progress 并填写 maintainer（如 agent-xiamen-2026q3）。
# 若 maintainer 非空且 last_update 在 30 天内，视为他人正在工作，请换城市。
#
# tier: 一线 | 新一线 | 二线（参考通行分级，仅作优先级参考）
# priority: P0 首批 | P1 扩展批次

